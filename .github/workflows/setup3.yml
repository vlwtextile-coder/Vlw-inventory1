name: Setup VLW Logo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create logo and splash files
        run: |
          command -v convert >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick)

          R=app/src/main/res
          mkdir -p $R/drawable-nodpi $R/drawable $R/values $R/values-v31 $R/mipmap-anydpi-v26
          rm -f $R/layout/activity_splash.xml

          LOGO=""
          SPL=""
          for f in *.png *.PNG; do
            [ -f "$f" ] || continue
            W=$(identify -format %w "$f")
            H=$(identify -format %h "$f")
            if [ "$H" -gt $((W * 14 / 10)) ]; then SPL="$f"; else LOGO="$f"; fi
          done
          if [ -z "$LOGO" ] || [ -z "$SPL" ]; then
            echo "Need two PNG files in repo root: square logo and tall splash"
            exit 1
          fi

          convert "$LOGO" -resize 768x768 $R/drawable-nodpi/vlw_logo.png

          W=$(identify -format %w "$SPL")
          H=$(identify -format %h "$SPL")
          Y0=$((H * 1423 / 1774))
          STRIP=$((H - Y0))
          convert "$SPL" \( +clone -crop "${W}x2+0+$((Y0 + 1))" +repage -blur 0x12 -resize "${W}x${STRIP}!" \) -geometry "+0+${Y0}" -composite $R/drawable-nodpi/vlw_splash.png

          cat > $R/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="vlw_green">#0E4D32</color>
              <color name="vlw_gold">#C9A24B</color>
              <color name="vlw_cream">#FAF4EA</color>
              <color name="vlw_white">#FFFFFF</color>
              <color name="vlw_splash_bg">#020B1F</color>
          </resources>
          EOF

          cat > $R/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.VLW" parent="Theme.MaterialComponents.Light.NoActionBar">
                  <item name="colorPrimary">@color/vlw_green</item>
                  <item name="colorOnPrimary">@color/vlw_white</item>
                  <item name="android:statusBarColor">@color/vlw_cream</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:windowBackground">@color/vlw_cream</item>
              </style>
              <style name="Theme.VLW.Splash" parent="Theme.VLW">
                  <item name="android:windowBackground">@color/vlw_splash_bg</item>
                  <item name="android:statusBarColor">@color/vlw_splash_bg</item>
                  <item name="android:navigationBarColor">@color/vlw_splash_bg</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > $R/values-v31/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.VLW.Splash" parent="Theme.VLW">
                  <item name="android:windowBackground">@color/vlw_splash_bg</item>
                  <item name="android:statusBarColor">@color/vlw_splash_bg</item>
                  <item name="android:navigationBarColor">@color/vlw_splash_bg</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowSplashScreenBackground">@color/vlw_splash_bg</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@drawable/splash_empty</item>
              </style>
          </resources>
          EOF

          cat > $R/drawable/splash_empty.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:pathData="M0,0h1v1h-1z"
                  android:fillColor="#00000000" />
          </vector>
          EOF

          cat > $R/drawable/ic_launcher_foreground.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <inset xmlns:android="http://schemas.android.com/apk/res/android"
              android:drawable="@drawable/vlw_logo"
              android:insetLeft="18dp"
              android:insetTop="18dp"
              android:insetRight="18dp"
              android:insetBottom="18dp" />
          EOF

          cat > $R/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/vlw_cream" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat > $R/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/vlw_cream" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat > app/src/main/java/com/vlw/inventory/SplashActivity.kt <<'EOF'
          package com.vlw.inventory

          import android.animation.Animator
          import android.animation.AnimatorListenerAdapter
          import android.animation.ValueAnimator
          import android.content.Context
          import android.content.Intent
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.LinearGradient
          import android.graphics.Paint
          import android.graphics.RectF
          import android.graphics.Shader
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.view.animation.AccelerateDecelerateInterpolator
          import android.view.animation.LinearInterpolator
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity

          class GoldProgressView(context: Context) : View(context) {
              var progress: Float = 0f
                  set(value) {
                      field = value
                      invalidate()
                  }

              private val trackPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#232C38")
              }
              private val strokePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeWidth = 2f
                  color = Color.parseColor("#B8C0CC")
              }
              private val fillPaint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val rect = RectF()

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val w = width.toFloat()
                  val h = height.toFloat()
                  val r = h / 2f
                  rect.set(1f, 1f, w - 1f, h - 1f)
                  canvas.drawRoundRect(rect, r, r, trackPaint)
                  val fw = (w - 2f) * progress
                  if (fw > 0f) {
                      fillPaint.shader = LinearGradient(
                          0f, 0f, w, 0f,
                          intArrayOf(
                              Color.parseColor("#B8860B"),
                              Color.parseColor("#FFD76A"),
                              Color.parseColor("#E0A526")
                          ),
                          null, Shader.TileMode.CLAMP
                      )
                      val right = minOf(1f + maxOf(fw, h - 2f), w - 1f)
                      rect.set(1f, 1f, right, h - 1f)
                      canvas.drawRoundRect(rect, r, r, fillPaint)
                  }
                  rect.set(1f, 1f, w - 1f, h - 1f)
                  canvas.drawRoundRect(rect, r, r, strokePaint)
              }
          }

          class SplashActivity : AppCompatActivity() {
              private var shimmer: ValueAnimator? = null
              private var loader: ValueAnimator? = null
              private var opened = false

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = FrameLayout(this)
                  root.setBackgroundColor(Color.parseColor("#020B1F"))

                  val image = ImageView(this)
                  image.setImageResource(R.drawable.vlw_splash)
                  image.scaleType = ImageView.ScaleType.CENTER_CROP
                  root.addView(
                      image,
                      FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  )
                  setContentView(root)

                  root.post {
                      val w = root.width
                      val h = root.height
                      if (w == 0 || h == 0) {
                          openMain()
                          return@post
                      }

                      val bandW = (w * 0.35f).toInt()
                      val band = View(this)
                      band.background = GradientDrawable(
                          GradientDrawable.Orientation.LEFT_RIGHT,
                          intArrayOf(0x00FFFFFF, 0x38FFFFFF, 0x00FFFFFF)
                      )
                      val bandLp = FrameLayout.LayoutParams(bandW, (h * 0.07f).toInt())
                      bandLp.topMargin = (h * 0.275f).toInt()
                      root.addView(band, bandLp)
                      band.translationX = -bandW.toFloat()

                      val status = TextView(this)
                      status.text = "Initializing Application..."
                      status.setTextColor(Color.WHITE)
                      status.textSize = 15f
                      status.gravity = Gravity.CENTER
                      val statusLp = FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                      statusLp.topMargin = (h * 0.808f).toInt()
                      root.addView(status, statusLp)

                      val side = (w * 0.17f).toInt()
                      val bar = GoldProgressView(this)
                      val barLp = FrameLayout.LayoutParams(w - 2 * side, dp(9))
                      barLp.leftMargin = side
                      barLp.topMargin = (h * 0.8625f).toInt() - dp(4)
                      root.addView(bar, barLp)

                      val pct = TextView(this)
                      pct.text = "0%"
                      pct.setTextColor(Color.parseColor("#F2C14E"))
                      pct.textSize = 13f
                      pct.gravity = Gravity.CENTER
                      val pctLp = FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                      pctLp.topMargin = (h * 0.885f).toInt()
                      root.addView(pct, pctLp)

                      shimmer = ValueAnimator.ofFloat(-bandW.toFloat(), w.toFloat()).apply {
                          duration = 1600
                          repeatCount = ValueAnimator.INFINITE
                          interpolator = LinearInterpolator()
                          addUpdateListener { band.translationX = it.animatedValue as Float }
                          start()
                      }

                      loader = ValueAnimator.ofFloat(0f, 1f).apply {
                          duration = 2800
                          interpolator = AccelerateDecelerateInterpolator()
                          addUpdateListener {
                              val v = it.animatedValue as Float
                              bar.progress = v
                              pct.text = "${(v * 100).toInt()}%"
                          }
                          addListener(object : AnimatorListenerAdapter() {
                              override fun onAnimationEnd(animation: Animator) {
                                  openMain()
                              }
                          })
                          start()
                      }
                  }
              }

              private fun openMain() {
                  if (opened) return
                  opened = true
                  shimmer?.cancel()
                  startActivity(Intent(this, MainActivity::class.java))
                  overridePendingTransition(android.R.anim.fade_in, android.R.anim.fade_out)
                  finish()
              }

              override fun onDestroy() {
                  loader?.removeAllListeners()
                  loader?.cancel()
                  shimmer?.cancel()
                  super.onDestroy()
              }
          }
          EOF

      - name: Commit files
        run: |
          git config user.name "vlw-setup"
          git config user.email "vlw-setup@users.noreply.github.com"
          git add -A
          git commit -m "Add VLW logo icon and splash" || echo "nothing to commit"
          git push
