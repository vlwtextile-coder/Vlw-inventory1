name: Setup VLW Icon

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create icon and splash files
        run: |
          R=app/src/main/res
          mkdir -p $R/values $R/values-v31 $R/drawable $R/mipmap-anydpi-v26 $R/layout
          mkdir -p app/src/main/java/com/vlw/inventory

          sed -i 's/minSdk 24/minSdk 26/' app/build.gradle

          cat > $R/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="vlw_navy">#0B1F4B</color>
              <color name="vlw_gold">#C9A24B</color>
              <color name="vlw_white">#FFFFFF</color>
              <color name="vlw_cream">#FAF7F0</color>
          </resources>
          EOF

          cat > $R/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.VLW" parent="Theme.MaterialComponents.Light.NoActionBar">
                  <item name="colorPrimary">@color/vlw_navy</item>
                  <item name="colorOnPrimary">@color/vlw_white</item>
                  <item name="android:statusBarColor">@color/vlw_navy</item>
                  <item name="android:windowBackground">@color/vlw_cream</item>
              </style>
              <style name="Theme.VLW.Splash" parent="Theme.VLW">
                  <item name="android:windowBackground">@color/vlw_navy</item>
              </style>
          </resources>
          EOF

          cat > $R/values-v31/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.VLW.Splash" parent="Theme.VLW">
                  <item name="android:windowBackground">@color/vlw_navy</item>
                  <item name="android:windowSplashScreenBackground">@color/vlw_navy</item>
              </style>
          </resources>
          EOF

          cat > $R/drawable/ic_launcher_foreground.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:pathData="M28,42 L35,62 L42,42"
                  android:fillColor="#00000000"
                  android:strokeColor="#FFFFFF"
                  android:strokeWidth="4"
                  android:strokeLineCap="round"
                  android:strokeLineJoin="round" />
              <path
                  android:pathData="M47,42 L47,62 L58,62"
                  android:fillColor="#00000000"
                  android:strokeColor="#FFFFFF"
                  android:strokeWidth="4"
                  android:strokeLineCap="round"
                  android:strokeLineJoin="round" />
              <path
                  android:pathData="M62,42 L66,62 L71,48 L76,62 L80,42"
                  android:fillColor="#00000000"
                  android:strokeColor="#FFFFFF"
                  android:strokeWidth="4"
                  android:strokeLineCap="round"
                  android:strokeLineJoin="round" />
              <path
                  android:pathData="M28,70 L80,70"
                  android:fillColor="#00000000"
                  android:strokeColor="#C9A24B"
                  android:strokeWidth="1.5"
                  android:strokeLineCap="round" />
          </vector>
          EOF

          cat > $R/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/vlw_navy" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat > $R/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/vlw_navy" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat > $R/layout/activity_splash.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/vlw_navy"
              android:gravity="center"
              android:orientation="vertical">

              <ImageView
                  android:id="@+id/logo"
                  android:layout_width="220dp"
                  android:layout_height="220dp"
                  android:contentDescription="VLW"
                  android:src="@drawable/ic_launcher_foreground" />

              <TextView
                  android:id="@+id/brand"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="8dp"
                  android:text="VLW TEXTILE"
                  android:textColor="@color/vlw_gold"
                  android:textSize="13sp"
                  android:textStyle="bold"
                  android:letterSpacing="0.3" />
          </LinearLayout>
          EOF

          cat > app/src/main/java/com/vlw/inventory/SplashActivity.kt <<'EOF'
          package com.vlw.inventory

          import android.content.Intent
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import androidx.appcompat.app.AppCompatActivity

          class SplashActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_splash)

                  val logo = findViewById<android.view.View>(R.id.logo)
                  val brand = findViewById<android.view.View>(R.id.brand)

                  logo.alpha = 0f
                  logo.scaleX = 0.9f
                  logo.scaleY = 0.9f
                  brand.alpha = 0f

                  logo.animate().alpha(1f).scaleX(1f).scaleY(1f).setDuration(600).start()
                  brand.animate().alpha(1f).setStartDelay(400).setDuration(600).withEndAction {
                      Handler(Looper.getMainLooper()).postDelayed({
                          startActivity(Intent(this@SplashActivity, MainActivity::class.java))
                          finish()
                      }, 500)
                  }.start()
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="VLW"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@style/Theme.VLW">
                  <activity
                      android:name=".SplashActivity"
                      android:exported="true"
                      android:theme="@style/Theme.VLW.Splash">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".MainActivity"
                      android:exported="false" />
              </application>
          </manifest>
          EOF

      - name: Commit files
        run: |
          git config user.name "vlw-setup"
          git config user.email "vlw-setup@users.noreply.github.com"
          git add -A
          git commit -m "Add VLW icon and splash" || echo "nothing to commit"
          git push
